name: Design preview artifact

on:
  push:
    branches:
      - design/impeccable-homepage-pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: saipan-design-preview
          path: dist/
          retention-days: 7
