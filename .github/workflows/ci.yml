# 开发文档 §8：自动化检查在 CI 运行。本工作流与 package.json 的 ci 链一致。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  screenshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:demo
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Render actual website screenshots
        run: |
          (pnpm exec astro preview --host 127.0.0.1 --port 4321 > /tmp/saipan-preview.log 2>&1 &)
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4321/ >/dev/null && break; sleep 2; done
          mkdir -p screenshots
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "1440,900" --full-page http://127.0.0.1:4321/ screenshots/desktop.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --device "iPhone 13" --full-page http://127.0.0.1:4321/ screenshots/mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: actual-homepage-screenshots
          path: screenshots/
          retention-days: 14
